<!doctype html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Register — I Quit Scoreboard</title>
    <link rel="manifest" href="/static/manifest.json" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="IQuitScore" />
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  </head>
  <body class="bg-gradient-to-br from-violet-100 via-pink-100 to-orange-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
      <div class="bg-gradient-to-br from-violet-50 to-pink-50 rounded-3xl border-2 border-violet-300 shadow-2xl p-8">
        <div class="text-center mb-6">
          <div class="text-6xl mb-3">🎮</div>
          <h1 class="text-3xl font-bold text-violet-900 mb-2">I Quit Scoreboard</h1>
          <p class="text-violet-700">Create your account</p>
        </div>

        {% if success %}
        <div class="mb-4 rounded-xl border-2 border-emerald-300 bg-gradient-to-r from-emerald-50 to-teal-50 text-emerald-800 px-4 py-3 text-sm font-medium shadow-sm">
          ✅ {{ success }}
        </div>
        {% endif %}

        {% if error %}
        <div class="mb-4 rounded-xl border-2 border-rose-300 bg-gradient-to-r from-rose-50 to-orange-50 text-rose-800 px-4 py-3 text-sm font-medium shadow-sm">
          ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/register" class="space-y-4">
          <div>
            <label class="block text-sm font-bold text-violet-900 mb-1">Username</label>
            <input 
              type="text" 
              name="username" 
              required 
              autofocus
              minlength="3"
              class="w-full rounded-xl border-2 border-violet-200 focus:border-violet-400 focus:ring-2 focus:ring-violet-200 px-4 py-3 transition-all"
              placeholder="Choose a username"
            />
          </div>

          <div>
            <label class="block text-sm font-bold text-violet-900 mb-1">Email</label>
            <input 
              type="email" 
              name="email" 
              required 
              class="w-full rounded-xl border-2 border-violet-200 focus:border-violet-400 focus:ring-2 focus:ring-violet-200 px-4 py-3 transition-all"
              placeholder="your@email.com"
            />
          </div>

          <div>
            <label class="block text-sm font-bold text-violet-900 mb-2">I am a...</label>
            <div class="grid grid-cols-2 gap-3">
              <label class="cursor-pointer">
                <input type="radio" name="role" value="scorer" class="sr-only peer" />
                <div class="rounded-xl border-2 border-slate-200 peer-checked:border-violet-500 peer-checked:bg-violet-50 p-3 text-center transition-all hover:border-violet-300">
                  <div class="text-2xl mb-1">🎮</div>
                  <div class="font-bold text-violet-900 text-sm">Scorer</div>
                  <div class="text-xs text-violet-600 mt-0.5">Creates &amp; manages games</div>
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="role" value="player" class="sr-only peer" checked />
                <div class="rounded-xl border-2 border-slate-200 peer-checked:border-pink-500 peer-checked:bg-pink-50 p-3 text-center transition-all hover:border-pink-300">
                  <div class="text-2xl mb-1">👤</div>
                  <div class="font-bold text-violet-900 text-sm">Player</div>
                  <div class="text-xs text-violet-600 mt-0.5">Plays games, views history</div>
                </div>
              </label>
            </div>
          </div>

          <div>
            <label class="block text-sm font-bold text-violet-900 mb-1">Password</label>
            <input 
              type="password" 
              name="password" 
              required 
              minlength="6"
              class="w-full rounded-xl border-2 border-violet-200 focus:border-violet-400 focus:ring-2 focus:ring-violet-200 px-4 py-3 transition-all"
              placeholder="Choose a password (min 6 chars)"
            />
          </div>

          <button 
            type="submit"
            class="w-full rounded-xl bg-gradient-to-r from-violet-600 to-pink-600 hover:from-violet-700 hover:to-pink-700 text-white px-6 py-4 text-lg font-bold shadow-lg hover:shadow-xl transition-all">
            ✨ Create Account
          </button>
        </form>

        <div class="mt-6 text-center">
          <p class="text-sm text-violet-700">
            Already have an account? 
            <a href="/login" class="font-bold text-pink-600 hover:text-pink-700 underline">Login here</a>
          </p>
        </div>
      </div>

      <div class="mt-4 text-center">
        <p class="text-sm text-violet-600 font-medium">
          💻 Developed by <span class="font-bold bg-gradient-to-r from-violet-600 to-pink-600 bg-clip-text text-transparent">Aziz Zoaib</span>
        </p>
      </div>
    </div>
  </body>
</html>
